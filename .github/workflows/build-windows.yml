name: Build and publish ScreenBreak for Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Package ScreenBreak
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name ScreenBreak --collect-all mediapipe --collect-all cv2 --collect-all numpy ScreenBreak/screenbreak.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path "$env:ProgramFiles (x86)" 'Inno Setup 6\ISCC.exe'
          & $iscc ScreenBreak.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBreak-Windows-Installer
          path: dist-installer/ScreenBreak-Setup.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ScreenBreak-Windows-Installer
          path: dist-installer
      - name: Publish latest installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          $notes = "Standalone 64-bit Windows installer. Python and pip are not required on the computer where ScreenBreak is installed."
          gh release create $tag dist-installer/ScreenBreak-Setup.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ScreenBreak Windows installer" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }